name: Build with CMake
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake_build_on_ubuntu:
    runs-on: ubuntu-latest
    steps:
      # The runner image ships an apt index that is stale but younger than the
      # 5 minutes cache-apt-pkgs-action uses to decide whether to refresh, so
      # it will not do this for us.  Without it the index names package
      # versions the mirrors have already dropped and the install 404s.
      - name: Refresh apt indexes
        run: sudo apt-get update
      - name: Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: zlib1g-dev libjpeg-dev libhdf5-dev
          version: 1.0 # bump to invalidate the package cache
      # cache-apt-pkgs-action logs install failures but still exits 0, which
      # turns a missing dependency into a confusing CPM fallback later on.
      - name: Check dependencies landed
        run: test -f /usr/include/jpeglib.h && test -f /usr/include/zlib.h
      - name: Checkout on Ubuntu
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch all history for git describe to work
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy nanobind
      - name: Build on Ubuntu
        uses: threeal/cmake-action@v2.1.0
        with:
          generator: Ninja
          run-build: true
          options: |
            BUILD_PYTHON_BINDINGS=OFF
