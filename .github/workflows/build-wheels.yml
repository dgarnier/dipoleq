name: Build Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "test-*"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an intel runner, macos-14 is apple silicon
        # os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
        os: [ubuntu-latest, macos-14, macos-15-intel] # need to fix windows.. leave off for now

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # make sure we get the version info

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          extras: "uv"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # make sure we get the version info

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # required to create github release
      contents: write
      # write permission is required for autolabeler
      pull-requests: write
      # required for pipy trusted publisher
      id-token: write
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Get version
        id: get_version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=$TAG" >> $GITHUB_OUTPUT
          # a final release is vN.N.N and nothing else, so a6/b1/rc1 and
          # anything unrecognised are prereleases
          if [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Changelog
        id: create-release
        uses: release-drafter/release-drafter@v7
        with:
          tag: ${{ steps.get_version.outputs.version }}
          version: ${{ steps.get_version.outputs.version }}
          prerelease: ${{ steps.get_version.outputs.prerelease }}
          publish: true # ensures release is not marked as draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_pypi_test:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/test')
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
